<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator - Damar Art</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#f7f5f2] min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
    
    <!-- Top Header Brand -->
    <div class="bg-[#a4413b] p-6 text-center text-white border-b-4 border-[#e3b695]">
      <a href="index.html" class="inline-block mb-2">
        <img src="https://damarart.com/wp-content/uploads/2023/10/penyun-news-4-1-hitam-tulisan-copy-lans1-1.png" alt="Damar Art Logo" class="h-10 w-auto brightness-0 invert mx-auto" onerror="this.onerror=null; this.src='https://damarart.com/wp-content/uploads/2023/12/cropped-favicon.jpg'">
      </a>
      <h2 class="text-xl font-bold font-['Montserrat']">Login Operator Sanggar</h2>
      <p class="text-xs text-[#e3b695] mt-1">Portal Pengurus & Pelatih Damar Art</p>
    </div>

    <!-- Login Form -->
    <div class="p-6 sm:p-8 space-y-5">
      
      <div id="loginAlert" class="hidden p-3 rounded-lg bg-green-50 text-green-700 text-xs border border-green-200">
        Login berhasil! Mengalihkan ke dashboard...
      </div>

      <form id="operatorLoginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-[#444444] mb-1.5">Username / Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i class="fas fa-user"></i>
            </span>
            <input type="text" id="username" required placeholder="Masukkan username" class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:border-[#a4413b]">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-[#444444] mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" id="password" required placeholder="••••••••" class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:border-[#a4413b]">
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-[#666666]">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded text-[#a4413b] focus:ring-[#a4413b]">
            <span>Ingat Saya</span>
          </label>
          <a href="https://damarart.com/wp-login.php?action=lostpassword" target="_blank" class="text-[#a4413b] hover:underline">Lupa Password?</a>
        </div>

        <button type="submit" class="w-full py-3 rounded-lg bg-[#a4413b] hover:bg-[#852924] text-white font-bold text-xs shadow transition-colors flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i>
          <span>Log In Operator</span>
        </button>
      </form>

      <div class="pt-4 border-t border-gray-100 text-center space-y-2 text-xs text-[#777777]">
        <p>Bila ini website live asli, login akan langsung mengarah ke <a href="https://damarart.com/login/" target="_blank" class="text-[#a4413b] font-semibold underline">Server WordPress Asli</a>.</p>
        <p><a href="index.html" class="text-[#a4413b] font-semibold hover:underline">← Kembali ke Beranda</a></p>
      </div>

    </div>

  </div>

  <script>
    function handleLoginSubmit(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.remove('hidden');
      alertBox.innerText = `Login berhasil sebagai ${username}! Mengalihkan ke Dashboard Operator...`;
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    }
  </script>
</body>
</html>
